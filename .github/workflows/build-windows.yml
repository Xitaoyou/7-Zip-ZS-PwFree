name: Build Windows binaries

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            arch: x64
            artifact: win-x64
          - platform: arm64
            arch: amd64_arm64
            artifact: win-arm64

    runs-on: windows-latest

    env:
      PLATFORM: ${{ matrix.platform }}
      VC: v143
      SUBSYS: "6.00"
      APPVEYOR_BUILD_FOLDER: ${{ github.workspace }}
      ZIP7_DARKMODE: "0"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up MSVC ${{ matrix.arch }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}
        spectre: false

    - name: Show toolchain
      shell: cmd
      run: |
        where cl
        cl
        echo PLATFORM=%PLATFORM% VC=%VC% SUBSYS=%SUBSYS%

    - name: Build all bundles
      shell: cmd
      working-directory: CPP
      run: |
        call build-it.cmd -all > "%APPVEYOR_BUILD_FOLDER%\build.log" 2>&1
        exit /b %ERRORLEVEL%

    - name: Show build log
      if: always()
      shell: cmd
      run: type "%APPVEYOR_BUILD_FOLDER%\build.log"

    - name: Report failures as annotations
      if: failure()
      shell: cmd
      run: |
        set "LOG=%APPVEYOR_BUILD_FOLDER%\build.log"
        if not exist "%LOG%" exit /b 0
        findstr /N /C:": error" /C:"error C" /C:"error LNK" /C:": fatal error" /C:"!! ERROR" "%LOG%" > "%APPVEYOR_BUILD_FOLDER%\errors.txt"
        type "%APPVEYOR_BUILD_FOLDER%\errors.txt"
        for /f "tokens=1,* delims=:" %%A in ('findstr /N "^" "%LOG%" ^| findstr /R "^[0-9]*:[0-9]*:"') do @echo ::error::%%B
        exit /b 0

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.platform }}
        path: build.log
        if-no-files-found: warn

    - name: Collect outputs
      if: success()
      shell: cmd
      run: |
        if not exist out mkdir out
        copy bin-%VC%-%PLATFORM%\*.* out\
        dir out

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: out/*
        if-no-files-found: error
