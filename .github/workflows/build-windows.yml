name: Build Windows binaries

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            arch: x64
            artifact: win-x64
          - platform: arm64
            arch: amd64_arm64
            artifact: win-arm64

    runs-on: windows-latest

    env:
      PLATFORM: ${{ matrix.platform }}
      VC: v143
      SUBSYS: "6.00"
      APPVEYOR_BUILD_FOLDER: ${{ github.workspace }}
      ZIP7_DARKMODE: "0"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up MSVC ${{ matrix.arch }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}
        spectre: false

    # MSVC can build every ARM64 bundle with its own compiler as long as the
    # GNU-flavoured LZMA decoder assembly is disabled: CPP/7zip/LzmaDec.mak only
    # pulls Asm/arm64/LzmaDecOpt.S when NO_ASM_GNU is undefined, and that .S file
    # needs clang-cl (not shipped in the runner image). Defining NO_ASM_GNU keeps
    # the portable C decoder, so ARM64 stays buildable with cl only.
    - name: Select ARM64 assembly strategy
      if: matrix.platform == 'arm64'
      shell: cmd
      run: |
        echo NO_ASM_GNU=1>> %GITHUB_ENV%
        echo arm64: NO_ASM_GNU=1 (portable LZMA decoder, no clang-cl dependency)

    - name: Show toolchain
      shell: cmd
      run: |
        where cl
        cl
        echo PLATFORM=%PLATFORM% VC=%VC% SUBSYS=%SUBSYS% NO_ASM_GNU=%NO_ASM_GNU%

    - name: Build all bundles
      shell: cmd
      working-directory: CPP
      run: |
        call build-it.cmd -all > "%APPVEYOR_BUILD_FOLDER%\build.log" 2>&1
        exit /b %ERRORLEVEL%

    - name: Show build log
      if: always()
      shell: cmd
      run: type "%APPVEYOR_BUILD_FOLDER%\build.log"

    - name: Report failures as annotations
      if: failure()
      shell: pwsh
      run: |
        $log = Join-Path $env:APPVEYOR_BUILD_FOLDER 'build.log'
        if (-not (Test-Path $log)) { Write-Host 'no build.log'; exit 0 }
        $lines = Get-Content -LiteralPath $log
        Write-Host "log lines: $($lines.Count)"
        $hits = $lines | Select-String -Pattern 'error C[0-9]|error LNK|fatal error|!! ERROR|NMAKE : ' -AllMatches
        foreach ($h in $hits | Select-Object -First 60) {
          Write-Host ("::error::" + $h.Line.Trim())
        }
        Write-Host '--- last 40 lines ---'
        $lines | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.platform }}
        path: build.log
        if-no-files-found: warn

    - name: Collect outputs
      if: success()
      shell: cmd
      run: |
        if not exist out mkdir out
        copy bin-%VC%-%PLATFORM%\*.* out\
        dir out

    # A native x64 runnable smoke test: build an archive with the freshly
    # produced binaries and read it back. ARM64 binaries cannot execute on the
    # x64 runner, so that leg only verifies the binaries were produced.
    - name: Smoke test (x64)
      if: success() && matrix.platform == 'x64'
      shell: cmd
      run: |
        set SEVENZIP=%APPVEYOR_BUILD_FOLDER%\bin-%VC%-%PLATFORM%\7z.exe
        echo smoke payload> smoke.txt
        "%SEVENZIP%" a -tzip -mx9 smoke.zip smoke.txt
        if errorlevel 1 exit /b 1
        "%SEVENZIP%" t smoke.zip
        if errorlevel 1 exit /b 1
        "%SEVENZIP%" i
        if errorlevel 1 exit /b 1
        echo smoke test passed

    # Advisory end-to-end check of the PwFree chain: the archive is encrypted
    # with a password that lives in the vendor's public word list, so a working
    # resolver opens it without any prompt. Network reachability of the
    # dictionary host is outside our control, hence continue-on-error.
    - name: PwFree end-to-end (advisory)
      if: success() && matrix.platform == 'x64'
      continue-on-error: true
      shell: cmd
      run: |
        set SEVENZIP=%APPVEYOR_BUILD_FOLDER%\bin-%VC%-%PLATFORM%\7z.exe
        reg add "HKCU\Software\7-Zip-Zstandard\PwFree" /v Enabled /t REG_DWORD /d 1 /f
        reg add "HKCU\Software\7-Zip-Zstandard\PwFree" /v UseCloud /t REG_DWORD /d 1 /f
        reg add "HKCU\Software\7-Zip-Zstandard\PwFree" /v DictBudgetMs /t REG_DWORD /d 600000 /f
        "%SEVENZIP%" a -tzip -p123 -mem=ZipCrypto pw.zip smoke.txt
        if errorlevel 1 exit /b 1
        "%SEVENZIP%" t pw.zip < nul > pwfree.log 2>&1
        type pwfree.log
        findstr /C:"Everything is Ok" pwfree.log

    # Verify 7zFM.exe launches without crashing (catches ABI/manifest/DLL errors).
    - name: GUI launch smoke test (x64)
      if: success() && matrix.platform == 'x64'
      shell: pwsh
      run: |
        $fm = Join-Path $env:APPVEYOR_BUILD_FOLDER "out\7zFM.exe"
        $p = Start-Process -FilePath $fm -PassThru
        Start-Sleep -Seconds 3
        if ($p.HasExited) {
          Write-Host ("::error::7zFM.exe exited prematurely with code 0x{0:X8}" -f $p.ExitCode)
          exit 1
        }
        Write-Host ("7zFM.exe launch OK (PID={0})" -f $p.Id)
        $p.CloseMainWindow() | Out-Null
        Start-Sleep -Milliseconds 500
        if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

    # Package x64 portable zip and native x64 SFX installer.
    - name: Package x64 installer and portable zip
      if: success() && matrix.platform == 'x64'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $root = $env:APPVEYOR_BUILD_FOLDER
        $out = Join-Path $root 'out'
        $dist = Join-Path $root 'dist'
        $port = Join-Path $root 'pkg-portable'
        $inst = Join-Path $root 'pkg-install'
        New-Item -ItemType Directory -Force -Path $dist, $port, (Join-Path $port 'Codecs'), $inst, (Join-Path $inst 'Codecs') | Out-Null

        $coreFiles = @('7zFM.exe', '7zG.exe', '7z.exe', '7z.dll', '7-zip.dll', '7z.sfx', '7zCon.sfx')
        $extraPortable = @('7za.exe', '7zz.exe', '7zFMa.exe')
        $codecDlls = @('brotli.dll', 'lizard.dll', 'lz4.dll', 'lz5.dll', 'zstd.dll', 'flzma2.dll')

        foreach ($f in $coreFiles) {
          $src = Join-Path $out $f
          if (Test-Path $src) {
            Copy-Item $src $port
            Copy-Item $src $inst
          }
        }
        foreach ($f in $extraPortable) {
          $src = Join-Path $out $f
          if (Test-Path $src) { Copy-Item $src $port }
        }
        if (Test-Path (Join-Path $out 'Uninstall.exe')) {
          Copy-Item (Join-Path $out 'Uninstall.exe') $inst
        }
        foreach ($c in $codecDlls) {
          $src = Join-Path $out $c
          if (Test-Path $src) {
            Copy-Item $src (Join-Path $port 'Codecs')
            Copy-Item $src (Join-Path $inst 'Codecs')
          }
        }
        foreach ($doc in @('License.txt', 'readme.txt')) {
          $src = Join-Path $root "DOC\$doc"
          if (Test-Path $src) {
            Copy-Item $src $port
            Copy-Item $src $inst
          }
        }

        $sevenZip = Join-Path $out '7z.exe'
        $portZip = Join-Path $dist 'UnlockZip-x64-portable.zip'
        & $sevenZip a -tzip -mx9 $portZip "$port\*"
        if ($LASTEXITCODE -ne 0) { exit 1 }

        # 7zipInstall.exe is compiled with -DZ7_NO_METHOD_LZMA2, so the payload MUST use LZMA (not LZMA2).
        $payload = Join-Path $root 'installer-payload.7z'
        & $sevenZip a -t7z -m0=LZMA -mf=BCJ2 -mx9 $payload "$inst\*"
        if ($LASTEXITCODE -ne 0) { exit 1 }

        $installStub = Join-Path $out 'Install.exe'
        $setupExe = Join-Path $dist 'UnlockZip-x64-setup.exe'
        cmd /c "copy /b `"$installStub`" + `"$payload`" `"$setupExe`""
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path $setupExe)) { exit 1 }

        # Verify the generated installer actually unpacks cleanly in silent mode.
        $testInst = Join-Path $env:RUNNER_TEMP 'pwfree-install-test'
        if (Test-Path $testInst) { Remove-Item -Recurse -Force $testInst }
        $proc = Start-Process -FilePath $setupExe -ArgumentList "/S", "/D=$testInst" -Wait -PassThru
        if ($proc.ExitCode -ne 0 -or -not (Test-Path (Join-Path $testInst '7zFM.exe')) -or -not (Test-Path (Join-Path $testInst '7z.dll'))) {
          Write-Host ("::error::Installer smoke test failed (exit={0})" -f $proc.ExitCode)
          exit 1
        }
        Write-Host "Installer silent smoke test passed!"

        Get-ChildItem $dist | Format-Table Name, Length

    - name: Upload x64 installer and portable packages
      if: success() && matrix.platform == 'x64'
      uses: actions/upload-artifact@v4
      with:
        name: UnlockZip-x64-packages
        path: dist/*
        if-no-files-found: error

    - name: Publish GitHub Release (on tag push)
      if: success() && matrix.platform == 'x64' && startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh
      run: |
        $tag = $env:GITHUB_REF_NAME
        $notes = @"
        ## UnlockZip $tag

        ### Highlights
        - **全新品牌与图标**：正式更名为 **UnlockZip**，配备全新 Win11 Fluent 风格透明多尺寸应用图标、统一窗口标题、安装包/卸载器与右键菜单
        - **修复安装包解压报错**：修正安装器载荷为 `-m0=LZMA -mf=BCJ2` 并加入 CI 静默安装烟测，确保双击开箱即装
        - **现代简约主窗口**：Bandizip 风格 2x 超采样抗锯齿矢量工具栏（含右侧快捷设置键）、面包屑地址栏、PerMonitorV2 高 DPI、浅/深色实时跟随与 PwFree 胶囊状态栏
        - **PwFree 极致云解密**：复用 7-Zip 原生 SHA-NI / ARMv8 硬件汇编 + WinZip AES CNG PBKDF2 + 多线程校验池 + 动态字典发现与 ETag/304 刷新

        ### 下载说明
        - `UnlockZip-x64-setup.exe`：Windows x64 原生安装包（含右键菜单与卸载程序）
        - `UnlockZip-x64-portable.zip`：Windows x64 便携版（解压即用）
        "@
        $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
        Set-Content -Path $notesFile -Value $notes -Encoding UTF8
        $exists = $false
        gh release view $tag > $null 2>&1
        if ($LASTEXITCODE -eq 0) { $exists = $true }
        if ($exists) {
          gh release upload $tag dist/UnlockZip-x64-setup.exe dist/UnlockZip-x64-portable.zip --clobber
          gh release edit $tag --title "UnlockZip $tag" --notes-file $notesFile
        } else {
          gh release create $tag dist/UnlockZip-x64-setup.exe dist/UnlockZip-x64-portable.zip --title "UnlockZip $tag" --notes-file $notesFile
        }

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: out/*
        if-no-files-found: error
