name: Build Windows binaries

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            arch: x64
            artifact: win-x64
          - platform: arm64
            arch: amd64_arm64
            artifact: win-arm64

    runs-on: windows-latest

    env:
      PLATFORM: ${{ matrix.platform }}
      VC: v143
      SUBSYS: "6.00"
      APPVEYOR_BUILD_FOLDER: ${{ github.workspace }}
      ZIP7_DARKMODE: "0"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up MSVC ${{ matrix.arch }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}
        spectre: false

    - name: Set up LLVM (arm64 assembly)
      if: matrix.platform == 'arm64'
      shell: pwsh
      run: |
        $candidates = @(
          'C:\Program Files\LLVM\bin\clang-cl.exe',
          'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\clang-cl.exe',
          'C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\bin\clang-cl.exe',
          'C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Tools\Llvm\x64\bin\clang-cl.exe'
        )
        $exe = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
        if (-not $exe) {
          Write-Host 'clang-cl not present in the image, installing LLVM'
          choco install llvm --yes --no-progress | Out-Host
          $exe = 'C:\Program Files\LLVM\bin\clang-cl.exe'
        }
        if (-not (Test-Path -LiteralPath $exe)) { throw "clang-cl is still missing: $exe" }
        $dir = Split-Path -Parent $exe
        Write-Host "clang-cl: $exe"
        $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & $exe --version

    - name: Show toolchain
      shell: cmd
      run: |
        where cl
        cl
        where clang-cl || echo clang-cl: not on PATH
        echo PLATFORM=%PLATFORM% VC=%VC% SUBSYS=%SUBSYS%

    - name: Build all bundles
      shell: cmd
      working-directory: CPP
      run: |
        call build-it.cmd -all > "%APPVEYOR_BUILD_FOLDER%\build.log" 2>&1
        exit /b %ERRORLEVEL%

    - name: Show build log
      if: always()
      shell: cmd
      run: type "%APPVEYOR_BUILD_FOLDER%\build.log"

    - name: Report failures as annotations
      if: failure()
      shell: pwsh
      run: |
        $log = Join-Path $env:APPVEYOR_BUILD_FOLDER 'build.log'
        if (-not (Test-Path $log)) { Write-Host 'no build.log'; exit 0 }
        $lines = Get-Content -LiteralPath $log
        Write-Host "log lines: $($lines.Count)"
        $hits = $lines | Select-String -Pattern 'error C[0-9]|error LNK|fatal error|!! ERROR|NMAKE : ' -AllMatches
        foreach ($h in $hits | Select-Object -First 60) {
          Write-Host ("::error::" + $h.Line.Trim())
        }
        Write-Host '--- last 40 lines ---'
        $lines | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.platform }}
        path: build.log
        if-no-files-found: warn

    - name: Collect outputs
      if: success()
      shell: cmd
      run: |
        if not exist out mkdir out
        copy bin-%VC%-%PLATFORM%\*.* out\
        dir out

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: out/*
        if-no-files-found: error
