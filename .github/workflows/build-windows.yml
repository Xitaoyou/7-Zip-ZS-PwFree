name: Build Windows binaries

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            arch: x64
            artifact: win-x64
          - platform: arm64
            arch: amd64_arm64
            artifact: win-arm64

    runs-on: windows-latest

    env:
      PLATFORM: ${{ matrix.platform }}
      VC: v143
      SUBSYS: "6.00"
      APPVEYOR_BUILD_FOLDER: ${{ github.workspace }}
      ZIP7_DARKMODE: "0"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up MSVC ${{ matrix.arch }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}
        spectre: false

    # MSVC can build every ARM64 bundle with its own compiler as long as the
    # GNU-flavoured LZMA decoder assembly is disabled: CPP/7zip/LzmaDec.mak only
    # pulls Asm/arm64/LzmaDecOpt.S when NO_ASM_GNU is undefined, and that .S file
    # needs clang-cl (not shipped in the runner image). Defining NO_ASM_GNU keeps
    # the portable C decoder, so ARM64 stays buildable with cl only.
    - name: Select ARM64 assembly strategy
      if: matrix.platform == 'arm64'
      shell: cmd
      run: |
        echo NO_ASM_GNU=1>> %GITHUB_ENV%
        echo arm64: NO_ASM_GNU=1 (portable LZMA decoder, no clang-cl dependency)

    - name: Show toolchain
      shell: cmd
      run: |
        where cl
        cl
        echo PLATFORM=%PLATFORM% VC=%VC% SUBSYS=%SUBSYS% NO_ASM_GNU=%NO_ASM_GNU%

    - name: Build all bundles
      shell: cmd
      working-directory: CPP
      run: |
        call build-it.cmd -all > "%APPVEYOR_BUILD_FOLDER%\build.log" 2>&1
        exit /b %ERRORLEVEL%

    - name: Show build log
      if: always()
      shell: cmd
      run: type "%APPVEYOR_BUILD_FOLDER%\build.log"

    - name: Report failures as annotations
      if: failure()
      shell: pwsh
      run: |
        $log = Join-Path $env:APPVEYOR_BUILD_FOLDER 'build.log'
        if (-not (Test-Path $log)) { Write-Host 'no build.log'; exit 0 }
        $lines = Get-Content -LiteralPath $log
        Write-Host "log lines: $($lines.Count)"
        $hits = $lines | Select-String -Pattern 'error C[0-9]|error LNK|fatal error|!! ERROR|NMAKE : ' -AllMatches
        foreach ($h in $hits | Select-Object -First 60) {
          Write-Host ("::error::" + $h.Line.Trim())
        }
        Write-Host '--- last 40 lines ---'
        $lines | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.platform }}
        path: build.log
        if-no-files-found: warn

    - name: Collect outputs
      if: success()
      shell: cmd
      run: |
        if not exist out mkdir out
        copy bin-%VC%-%PLATFORM%\*.* out\
        dir out

    # A native x64 runnable smoke test: build an archive with the freshly
    # produced binaries and read it back. ARM64 binaries cannot execute on the
    # x64 runner, so that leg only verifies the binaries were produced.
    - name: Smoke test (x64)
      if: success() && matrix.platform == 'x64'
      shell: cmd
      run: |
        set SEVENZIP=%APPVEYOR_BUILD_FOLDER%\bin-%VC%-%PLATFORM%\7z.exe
        echo smoke payload> smoke.txt
        "%SEVENZIP%" a -tzip -mx9 smoke.zip smoke.txt
        if errorlevel 1 exit /b 1
        "%SEVENZIP%" t smoke.zip
        if errorlevel 1 exit /b 1
        "%SEVENZIP%" i
        if errorlevel 1 exit /b 1
        echo smoke test passed

    # Advisory end-to-end check of the PwFree chain: the archive is encrypted
    # with a password that lives in the vendor's public word list, so a working
    # resolver opens it without any prompt. Network reachability of the
    # dictionary host is outside our control, hence continue-on-error.
    - name: PwFree end-to-end (advisory)
      if: success() && matrix.platform == 'x64'
      continue-on-error: true
      shell: cmd
      run: |
        set SEVENZIP=%APPVEYOR_BUILD_FOLDER%\bin-%VC%-%PLATFORM%\7z.exe
        reg add "HKCU\Software\7-Zip-Zstandard\PwFree" /v Enabled /t REG_DWORD /d 1 /f
        reg add "HKCU\Software\7-Zip-Zstandard\PwFree" /v UseCloud /t REG_DWORD /d 1 /f
        reg add "HKCU\Software\7-Zip-Zstandard\PwFree" /v DictBudgetMs /t REG_DWORD /d 600000 /f
        "%SEVENZIP%" a -tzip -p123 -mem=ZipCrypto pw.zip smoke.txt
        if errorlevel 1 exit /b 1
        "%SEVENZIP%" t pw.zip < nul > pwfree.log 2>&1
        type pwfree.log
        findstr /C:"Everything is Ok" pwfree.log

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: out/*
        if-no-files-found: error
