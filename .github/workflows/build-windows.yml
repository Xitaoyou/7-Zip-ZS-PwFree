name: Build Windows binaries

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            arch: x64
            runner: windows-latest
            artifact: win-x64
          - platform: arm64
            arch: arm64
            runner: windows-latest
            artifact: win-arm64

    runs-on: ${{ matrix.runner }}

    env:
      PLATFORM: ${{ matrix.platform }}
      VC: v143
      SUBSYS: "6.00"
      STOP_ON_ERROR: "1"
      ZIP7_DARKMODE: "1"
      APPVEYOR_BUILD_FOLDER: ${{ github.workspace }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Set up MSVC ${{ matrix.arch }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}
        spectre: false

    - name: Show toolchain
      shell: cmd
      run: |
        cl 2>&1 | findstr /C:"Version"
        echo PLATFORM=%PLATFORM% VC=%VC% SUBSYS=%SUBSYS%

    - name: Build all bundles
      shell: cmd
      working-directory: CPP
      run: build-it.cmd -all

    - name: Collect outputs
      shell: cmd
      run: |
        if not exist out mkdir out
        copy bin-%VC%-%PLATFORM%\*.* out\
        dir out

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: out/*
        if-no-files-found: error
